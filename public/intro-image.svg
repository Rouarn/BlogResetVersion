    <!-- Tech Info -->
    <g transform="translate(50, 70)">
      <rect width="180" height="20" rx="4" fill="#f1f5f9" />
      <text x="8" y="14" fill="#94a3b8" style="font-family: 'Segoe UI', Tahoma, sans-serif; font-size: 9px; font-weight: 600; text-transform: uppercase;">Vue 3.5 · Vite 7 · TypeScript 5 · Naive UI</text>
