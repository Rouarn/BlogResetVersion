<svg width="300" height="155" viewBox="0 0 300 155" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CED815;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8FC108;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="300" height="155" fill="#f8fafc" rx="8" />
  
  <!-- Decorative Top Bar -->
  <path d="M0 8 C0 3.58 3.58 0 8 0 H292 C296.42 0 300 3.58 300 8 V20 H0 V8 Z" fill="#f1f5f9" />
  <circle cx="15" cy="10" r="3" fill="#ff5f56" />
  <circle cx="25" cy="10" r="3" fill="#ffbd2e" />
  <circle cx="35" cy="10" r="3" fill="#27c93f" />

